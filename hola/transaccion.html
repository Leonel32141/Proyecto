<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Alquiler y Pago - Alquiler de Vehículos</title>
    <link rel="stylesheet" href="transaccion.css">
</head>
<body>
    <div class="transaccion-container">
        <h2>Confirmar tu Alquiler</h2>
        
        <!-- Tarjetas de vehículo e interior -->
        <div class="vehiculo-resumen">
            <div class="imagen-box">
                <h4>Vehículo</h4>
                <img id="imgAuto" src="" alt="Vehículo seleccionado">
            </div>
            <div class="imagen-box">
                <h4>Interior</h4>
                <img id="imgInterior" src="" alt="Interior del vehículo">
            </div>
        </div>

        <div class="vehiculo-info">
            <h3 id="nombreAuto">Cargando vehículo...</h3>
            <p id="tipoAuto" class="tipo-auto"></p>
            <p id="precioAuto" class="precio-auto"></p>
        </div>

        <!-- Formulario principal -->
        <form id="formTransaccion">
            <div class="campo">
                <label for="fechaInicio">Fecha de Retiro:</label>
                <input type="date" id="fechaInicio" class="input-calendario" required>
            </div>

            <div class="campo">
                <label for="fechaFin">Fecha de Devolución:</label>
                <input type="date" id="fechaFin" class="input-calendario" required>
            </div>

            <!-- SECCIÓN DE EXTRAS (Silla de bebé, GPS, etc.) -->
            <div class="extras-box">
                <h4>Servicios Adicionales (Extras)</h4>
                <label class="checkbox-label">
                    <input type="checkbox" class="extra-opcion" value="5000"> Silla de Bebé / Infantil (+$5.000 / día)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" class="extra-opcion" value="3000"> GPS Satelital (+$3.000 / día)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" class="extra-opcion" value="10000"> Seguro Contra Todo Riesgo (+$10.000 / día)
                </label>
            </div>

            <div class="total-box">
                <h3>Total Estimado: <span id="totalFinal">$0</span></h3>
            </div>

            <!-- SECCIÓN DE PAGO (Oculta hasta dar el paso siguiente) -->
            <div id="seccionPago" class="seccion-pago" style="display: none;">
                <h3>Datos de Pago y Verificación</h3>
                <div class="campo">
                    <label for="dniPasaporte">DNI o Pasaporte:</label>
                    <input type="text" id="dniPasaporte" placeholder="Ej: 45123456">
                </div>
                <div class="campo">
                    <label for="nroTarjeta">Número de Tarjeta de Crédito:</label>
                    <input type="text" id="nroTarjeta" placeholder="4500 1234 5678 9010" maxlength="19">
                </div>
                <div class="fila-doble">
                    <div class="campo">
                        <label for="vencimiento">Vencimiento:</label>
                        <input type="text" id="vencimiento" placeholder="MM/AA" maxlength="5">
                    </div>
                    <div class="campo">
                        <label for="cvv">CVV:</label>
                        <input type="password" id="cvv" placeholder="123" maxlength="4">
                    </div>
                </div>
            </div>

            <button type="submit" id="btnAccion" class="btn-confirmar">Continuar al Pago</button>
        </form>
        
        <div class="link-volver">
            <a href="index.html">← Volver al catálogo</a>
        </div>
    </div>

    <script src="transaccion.js"></script>
</body>
</html>
