<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Datos de Cliente - Los Pipiautos</title>
    <link rel="stylesheet" href="perfil-cliente.css">
</head>
<body>
    <div class="perfil-container">
        <h2>Verificación de Perfil</h2>
        <p class="subtitulo">
            Confirmá tus datos registrados y completá tu domicilio actual para habilitar el contrato de alquiler.
        </p>
        
        <form id="formCliente">
            <div class="campo">
                <label for="dni">DNI / Pasaporte (Registrado):</label>
                <input type="text" id="dni" readonly class="input-bloqueado" required>
            </div>

            <div class="campo">
                <label for="licencia">Licencia de Conducir (Mismo número de DNI):</label>
                <input type="text" id="licencia" readonly class="input-bloqueado" required>
            </div>

            <!-- Fecha de nacimiento precargada con botón de confirmación didáctico -->
            <div class="campo">
                <label for="fechaNacimiento">Fecha de Nacimiento (Registrada):</label>
                <div class="fila-confirmacion">
                    <input type="date" id="fechaNacimiento" readonly class="input-bloqueado" required>
                    <button type="button" id="btnConfirmarFecha" class="btn-secundario">Confirmar Fecha</button>
                </div>
                <small id="estadoFecha" style="color: #64748b; font-size: 0.75rem; margin-top: 4px; display: block;"></small>
            </div>

            <div class="campo">
                <label for="domicilio">Domicilio Actual:</label>
                <input type="text" id="domicilio" placeholder="Ej: Av. Rivadavia 5100, CABA" required>
            </div>

            <button type="submit" class="btn-guardar">Guardar y Continuar con el Alquiler</button>
        </form>
    </div>

    <script src="perfil-cliente.js"></script>
</body>
</html>
