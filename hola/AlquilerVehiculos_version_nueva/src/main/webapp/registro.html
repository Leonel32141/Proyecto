<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Los Pipiautos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <span class="badge">Los Pipiautos</span>
        <h1>Crear Cuenta</h1>
        <p>Debes ser mayor de 21 años para registrarte</p>
    </div>

    <div id="alertaError" class="alerta-error" style="display: none;"></div>
    <div id="alertaExito" class="alerta-exito" style="display: none;"></div>

    <form id="formRegistro">
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" id="nombre" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
            <label>Apellido</label>
            <input type="text" id="apellido" required placeholder="Tu apellido">
        </div>
        
        <!-- Fecha de nacimiento mejorada con límites lógicos -->
        <div class="form-group">
            <label>Fecha de Nacimiento</label>
            <input type="date" id="fecha_nacimiento" required>
            <small style="color: #666; font-size: 11px;">Debes tener al menos 21 años.</small>
        </div>
        
        <!-- Campo DNI -->
        <div class="form-group">
            <label for="dni">DNI</label>
            <input type="text" id="dni" placeholder="Ej: 45678912" inputmode="numeric" maxlength="8" required>
        </div>

        <!-- CUIL -->
        <div class="form-group">
            <label for="cuil">CUIL</label>
            <input type="text" id="cuil" name="cuil" placeholder="Ej: 20456789123" inputmode="numeric" maxlength="11" required>
        </div>

        <!-- Teléfono -->
        <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" placeholder="Ej: 1123456789" inputmode="numeric" maxlength="10" required>
        </div>

        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
        </div>

        <button type="submit" class="btn-auth">Registrarse</button>
    </form>

    <a href="login.html" class="auth-link">¿Ya tenés cuenta? Iniciar Sesión</a>
</div>

<script src="registro.js"></script>
</body>
</html>
