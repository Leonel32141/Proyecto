<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesar Pago y Contrato - Alquiler de Vehículos</title>
    <link rel="stylesheet" href="transaccion.css">
</head>
<body>
    <div class="transaccion-container">
        <h2>Pasarela de Pago</h2>
        
        <div class="vehiculo-resumen">
            <div class="vehiculo-info" style="width: 100%; text-align: left; padding: 10px;">
                <h3 id="resumenModelo" style="color: #58a6ff; margin-bottom: 5px;">Cargando resumen...</h3>
                <p id="resumenFechas" style="font-size: 0.85rem; color: #8b949e; margin: 0 0 5px 0;"></p>
                <p id="resumenTotal" style="font-weight: bold; color: #3fb950; font-size: 1.1rem; margin: 0;"></p>
            </div>
        </div>

        <form id="formPago">
            <div class="campo">
                <label for="nombreTitular">Nombre y Apellido del Titular:</label>
                <input type="text" id="nombreTitular" placeholder="Ej: Sebastián Quintero" required>
            </div>

            <div class="campo">
                <label for="dniPasaporte">DNI o Pasaporte (Bloqueado por seguridad):</label>
                <input type="text" id="dniPasaporte" readonly style="background-color: #1b1f24; color: #8b949e; cursor: not-allowed;" required>
            </div>

            <!-- Selector conectado a tu tabla meto_pago de MySQL -->
            <div class="campo">
                <label for="metodoPago">Método de Pago:</label>
                <select id="metodoPago" style="width: 100%; padding: 10px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; font-size: 1rem;" required>
                    <option value="2">Tarjeta de Crédito</option>
                    <option value="3">Transferencia Bancaria</option>
                </select>
            </div>

            <div class="campo">
                <label for="nroTarjeta">Número de Tarjeta de Crédito:</label>
                <input type="text" id="nroTarjeta" placeholder="4500 1234 5678 9010" maxlength="19" required>
            </div>

            <div class="fila-doble">
                <div class="campo">
                    <label for="vencimiento">Vencimiento:</label>
                    <input type="text" id="vencimiento" placeholder="MM/AA" maxlength="5" required>
                </div>
                <div class="campo">
                    <label for="cvv">CVV:</label>
                    <input type="password" id="cvv" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <button type="submit" class="btn-confirmar" style="background-color: #238636; margin-top: 10px;">Pagar y Generar Comprobante</button>
        </form>
        
        <div class="link-volver">
            <a href="transaccion.html">← Volver a modificar fechas</a>
        </div>
    </div>

    <script src="pago.js"></script>
</body>
</html>
